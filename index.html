<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred software repositories.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">A personal collection</p>
        <h1>Stargazers log</h1>
        <p class="intro">Software worth keeping an eye on.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span class="section-mark" aria-hidden="true">&#9733;</span>
        </div>
        <p id="list-status" class="list-status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
